name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bolt-diy

jobs:
  # 1. Build Web + Deploy to Cloudflare Pages
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_DISABLE_SOURCEMAPS: true
          VITE_OPTIMIZE_BUILD: true

      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "bolt-diy"
          directory: "./build/client"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/
          retention-days: 7

  # 2. Build & Push Docker Image
  docker:
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Upload Docker image info
        uses: actions/upload-artifact@v4
        with:
          name: docker-info
          path: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.labels }}
          retention-days: 7

  # 3. Build Android APK (via Bubblewrap)
  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create PWA manifest
        run: |
          cat > build/client/manifest.json << 'EOF'
          {
            "name": "Bolt DIY - AI Platform",
            "short_name": "Bolt DIY",
            "description": "Advanced AI development platform with local and cloud models",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#3b82f6",
            "orientation": "portrait-primary",
            "icons": [
              {
                "src": "/assets/icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "/assets/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Serve web app for Bubblewrap
        run: |
          cd build/client
          python3 -m http.server 8080 &
          sleep 10

      - name: Init Bubblewrap Project
        run: |
          bubblewrap init \
            --manifest http://localhost:8080/manifest.json \
            --directory ./android \
            --package-name com.boltdiy.app \
            --app-name "Bolt DIY" \
            --app-version-name "1.0.0" \
            --app-version-code 1

      - name: Build APK
        run: |
          cd android
          bubblewrap build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-diy-apk
          path: android/output/app-release-signed.apk
          retention-days: 30

      - name: Upload APK info
        run: |
          echo "APK built successfully!" > apk-info.txt
          echo "File: app-release-signed.apk" >> apk-info.txt
          echo "Size: $(ls -lh android/output/app-release-signed.apk | awk '{print $5}')" >> apk-info.txt
          echo "Date: $(date)" >> apk-info.txt

      - name: Upload APK info artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-info
          path: apk-info.txt
          retention-days: 7

  # 4. Notify completion
  notify:
    runs-on: ubuntu-latest
    needs: [web, docker, android]
    if: always()
    steps:
      - name: Check job status
        id: check
        run: |
          if [[ "${{ needs.web.result }}" == "success" && "${{ needs.docker.result }}" == "success" && "${{ needs.android.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All builds completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Some builds failed. Check the logs for details." >> $GITHUB_OUTPUT
          fi

      - name: Notify on success
        if: steps.check.outputs.status == 'success'
        run: |
          echo "🎉 CI Pipeline completed successfully!"
          echo "📱 Web: Deployed to Cloudflare Pages"
          echo "🐳 Docker: Pushed to GitHub Container Registry"
          echo "📱 Android: APK built and uploaded as artifact"
          echo ""
          echo "📋 Next steps:"
          echo "1. Download APK from Actions artifacts"
          echo "2. Pull Docker image: ghcr.io/${{ github.repository }}/bolt-diy:latest"
          echo "3. Access web app at your Cloudflare Pages URL"

      - name: Notify on failure
        if: steps.check.outputs.status == 'failure'
        run: |
          echo "❌ CI Pipeline failed!"
          echo "Web build: ${{ needs.web.result }}"
          echo "Docker build: ${{ needs.docker.result }}"
          echo "Android build: ${{ needs.android.result }}"
          echo ""
          echo "🔍 Check the logs above for detailed error information"