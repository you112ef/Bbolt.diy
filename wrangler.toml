# Cloudflare Pages Configuration for AI Platform
name = "ai-platform"
compatibility_date = "2024-01-15"
compatibility_flags = [
  "nodejs_compat",
  "webgpu",
  "experimental_webgpu",
  "streams_enable_constructors"
]

# Ensure Pages uses static output directory only
pages_build_output_dir = "build/client"

# Build configuration
[build]
command = "pnpm run build"
cwd = "."

# Build environment variables
[build.environment]
NODE_ENV = "production"
VITE_DISABLE_SOURCEMAPS = "true"
VITE_OPTIMIZE_BUILD = "true"

# Pages configuration
[pages]
build_output_dir = "build/client"

# Performance optimizations
[pages.functions]
node_compat = true

# Cache configuration
[pages.cache]
browser_ttl = 3600  # 1 hour
edge_ttl = 86400    # 24 hours

# Headers for security and performance
[[pages.headers]]
for = "/*"
[pages.headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://api.anthropic.com https://api.mistral.ai https://api.together.xyz https://api.groq.com https://api.perplexity.ai https://api.cohere.com https://api.deepseek.com https://api.x.ai https://api.hyperbolic.xyz https://api.github.com https://api.vercel.com https://api.netlify.com https://api.stripe.com https://api.sendgrid.com https://api.twilio.com https://api.firebase.com https://api.redis.com https://api.mongodb.com https://api.docker.com https://api.railway.app https://api.heroku.com https://api.planetscale.com https://api.cloudflare.com; frame-src 'self' https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';"

# Redirects for SPA routing
[[pages.redirects]]
from = "/app/*"
to = "/index.html"
status = 200

[[pages.redirects]]
from = "/chat/*"
to = "/index.html"
status = 200

[[pages.redirects]]
from = "/settings/*"
to = "/index.html"
status = 200

[[pages.redirects]]
from = "/agents/*"
to = "/index.html"
status = 200

# API routes
[[pages.redirects]]
from = "/api/*"
to = "/api/:splat"
status = 200

# Static assets caching
[[pages.headers]]
for = "/assets/*"
[pages.headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[pages.headers]]
for = "*.js"
[pages.headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[pages.headers]]
for = "*.css"
[pages.headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[pages.headers]]
for = "*.woff2"
[pages.headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Development settings
[dev]
port = 8788
local_protocol = "http"
upstream_protocol = "https"

# Development environment variables
[dev.vars]
NODE_ENV = "development"
VITE_DISABLE_SOURCEMAPS = "false"
VITE_OPTIMIZE_BUILD = "false"